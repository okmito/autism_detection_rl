# How this file is used (audit finding T4): app/config.py reads env.question_budget, eval.operating_threshold
# and policy.type with yaml.safe_load (tests/test_app_config.py pins them to the demo constants). The research
# scripts under scripts/ do NOT parse this file; their settings are literals, and values below that the code
# does not follow are annotated where they differ.
dataset:
  tier: T1
  # NOTE: not what the code runs. The NZ 1,054-row file is absent, so src/data/ingest.py raises for "nz";
  # every shipped path (app, demo, steps 2-17) uses the Saudi Q-CHAT-10 data ("saudi").
  name: nz

env:
  question_budget: 6
  b_min: 0
  cost_mode: uniform

reward:
  lambda_grid: [0.0, 0.01, 0.05]
  scoring: brier

predictor:
  hidden: [128, 64]
  # NOTE: the offline research artifacts (steps 2/3) use isotonic, but the web app and demos serve a Platt-
  # calibrated predictor (app/config.py DEMO_CALIBRATION = "platt"). Both are intentional and documented.
  calibration: isotonic
  freeze: true

policy:
  type: greedy
  # Single source of truth for the default execution path (V2 consolidation).
  # Greedy Information Gain is the primary policy: best matched-budget Brier
  # (0.0750 at B=6 on val; 10-seed benchmark).
  # Alternatives stay available where the application supports selection:
  #   beta_greedy  (experimental alternative/research baseline)
  #   irt_cat      (research comparison only; Brier 0.0835 val at B=6)
  #   hybrid_irt_evoi (removed from the default path: 950/950 action-identical
  #                    to EVOI-only, and its stopping rule underperforms
  #                    budget use; kept for reproducibility only)
  #   dqn / ppo    (RL research baselines; not served by the demo)
  #   rl_adaptive  (trained RL agent, 2026-11-13): chooses ASK(item)/STOP from the answers so far;
  #                learned STOP from 2 questions on, safety cap 10. Served from
  #                results/rl_adaptive/served_policy.json (scripts/step18-20) and only when that artifact records a
  #                passed integration gate; otherwise a request for it falls back to greedy and the session is
  #                labelled as a fallback. Selectable in the app; NOT the default until the supervisor ratifies the
  #                non-inferiority margin and the Polish cohort's role (RL_ADAPTIVE_REPORT.md section 12).
  #                To make it the default: type: rl_adaptive
  # Stopping: adaptive stopping is DISABLED in the default (greedy) workflow; rl_adaptive sessions stop by policy.
  # Sessions run to the environment question budget (6); ending early is a
  # manual action, not a policy decision. Bayesian predictive SD is retained
  # for experimental reporting only and never gates stopping.

eval:
  seeds: 10
  bootstrap_resamples: 2000
  operating_threshold: 0.5
  policy_state: questions_only
  primary_metric: brier
  fwer: holm_bonferroni

exact:
  authoritative_solver: custom_dp
  objective: empirical_brier_minus_cost
  max_states: 50000000
  max_hours: 24
  max_ram_gb: 32
